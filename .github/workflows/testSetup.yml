name: "Nix and Home Manager install "

on:
  push:
    branches: ["**"]
  # Remove for now due to being unable to reach curl script in MR
  # Also in the MR the jobs are duplicated so it may be unnecessary
  #  pull_request:
  #    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install curl
        run: sudo apt-get install curl -y

      - name: Install nix
        run: sh <(curl -L https://nixos.org/nix/install) --daemon --yes

      - name: Source to enable nix commands
        run: source /etc/profile

      - name: Run nix flake config
        run: |
          nix-shell -p home-manager \
            --run "home-manager switch \
            -b backup \
            --extra-experimental-features 'nix-command flakes' \
            --flake .#runner"
